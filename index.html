function update(){let v=Number(amount.value);dial.style.setProperty('--lift',v/100);dial.style.setProperty('--angle',v*2.7+'deg');dial.style.setProperty('--rotation',(-135+v*2.7)+'deg');value.textContent=v+'%';character.textContent=bypass.getAttribute('aria-pressed')==='true'?'Bypass activé':v===0?'La voix d’origine':v<34?'Présence légère':v<70?'Clarté et présence':'Éclat intense';amount.setAttribute('aria-valuetext',v+' pour cent')}
amount.addEventListener('input',update);dial.addEventListener('dblclick',()=>{amount.value=0;update()});let drag=null;amount.addEventListener('pointerdown',e=>{e.preventDefault();amount.focus();drag={y:e.clientY,v:Number(amount.value)};amount.setPointerCapture(e.pointerId)});amount.addEventListener('pointermove',e=>{if(drag){amount.value=Math.max(0,Math.min(100,Math.round(drag.v+(drag.y-e.clientY)/1.8)));update()}});amount.addEventListener('pointerup',()=>drag=null);amount.addEventListener('pointercancel',()=>drag=null);bypass.onclick=()=>{let off=bypass.getAttribute('aria-pressed')!=='true';bypass.setAttribute('aria-pressed',String(off));plugin.classList.toggle('off',off);update()};update();
